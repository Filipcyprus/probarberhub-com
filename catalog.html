<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wholesale Catalog — ProBarberHub</title>
<meta name="description" content="Browse 1,300+ professional barber and salon products at trade prices. Filter by brand, category, clearance and more, then build a wholesale quote." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23131417%22/><text x=%2250%22 y=%2268%22 font-size=%2258%22 font-family=%22Arial%22 font-weight=%22900%22 fill=%22%23E32227%22 text-anchor=%22middle%22>P</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=47">
</head>
<body data-page="catalog">

<div id="site-announce"></div>
<div id="site-topbar"></div>
<div id="sidebar-backdrop"></div>
<div class="shell">
  <aside id="site-sidebar"></aside>
  <div class="main-col">

<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / Catalog</div>
    <h1 style="margin-bottom:6px;">Wholesale Catalog</h1>
    <p class="lede mb-0" id="page-sub">Loading the full trade catalog…</p>
  </div>
</div>

<main class="container catalog-layout">
  <div class="filters">
    <div class="filter-group grow-search">
      <label for="f-search">Search</label>
      <input type="search" id="f-search" placeholder="Search products…" autocomplete="off">
    </div>
    <div class="filter-group">
      <label for="f-dept">Category</label>
      <select id="f-dept"><option value="">All Categories</option></select>
    </div>
    <div class="filter-group">
      <label for="f-brand">Brand</label>
      <select id="f-brand"><option value="">All Brands</option></select>
    </div>
    <div class="filter-group">
      <label for="f-type">Product Type</label>
      <select id="f-type"><option value="">All Types</option></select>
    </div>
    <div class="filter-group">
      <label for="f-sort">Sort By</label>
      <select id="f-sort">
        <option value="featured">Featured</option>
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="brand">Brand</option>
        <option value="clearance">Clearance first</option>
      </select>
    </div>
    <div class="filter-group" style="flex:0 0 auto;min-width:0;">
      <label>Deals</label>
      <div class="filter-checks">
        <label class="check-row"><input type="checkbox" id="f-clearance"> Clearance only</label>
        <label class="check-row"><input type="checkbox" id="f-new"> New arrivals</label>
      </div>
    </div>
    <button class="btn btn-outline btn-sm" id="f-clear">Clear Filters</button>
  </div>

  <div class="results-bar">
    <div class="results-count" id="results-count">Loading…</div>
    <div class="active-filters" id="active-filters"></div>
  </div>
  <div id="grid-wrap">
    <div class="skeleton-grid">
      <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
      <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
    </div>
  </div>
  <div class="load-more-wrap" id="load-more-wrap" style="display:none;">
    <button class="btn btn-dark" id="load-more">Load More Products</button>
  </div>
</main>

  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/app.js?v=47"></script>
<script src="js/cards.js?v=47"></script>
<script src="js/chrome.js?v=47"></script>
<script src="js/catalog.js?v=47"></script>
</body>
</html>
